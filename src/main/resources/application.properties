spring.application.name=ride-booking-system

# Values can be overridden with real environment variables in any real deployment;
# the parts after the colon are just local-dev defaults so `mvn spring-boot:run`
# keeps working out of the box against a local MySQL instance.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ridebooking_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=${SERVER_PORT:8080}
